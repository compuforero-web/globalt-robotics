# SOLO desarrollo local aislado: base propia, sin datos reales, publicado únicamente en 127.0.0.1.
name: globalt-aula-dev
services:
  db:
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    environment:
      POSTGRES_DB: aula
      POSTGRES_USER: aula
      POSTGRES_PASSWORD: ${AULA_DB_CLAVE:?Defina AULA_DB_CLAVE en .env}
    volumes: [aula-datos:/var/lib/postgresql/data]
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aula -d aula"]
      interval: 2s
      retries: 30
  api:
    build: .
    image: globalt-aula-api:dev
    depends_on: { db: { condition: service_healthy } }
    environment:
      AULA_DATABASE_URL: postgresql://aula:${AULA_DB_CLAVE}@db:5432/aula
      AULA_ORIGENES: ${AULA_ORIGENES:-http://127.0.0.1:8180}
      AULA_COOKIE_SEGURA: ${AULA_COOKIE_SEGURA:-false}
      AULA_SESION_INACTIVIDAD_MIN: ${AULA_SESION_INACTIVIDAD_MIN:-120}
      AULA_SESION_MAX_HORAS: ${AULA_SESION_MAX_HORAS:-168}
      AULA_MAX_FALLOS_CORREO: ${AULA_MAX_FALLOS_CORREO:-5}
      AULA_MAX_FALLOS_IP: ${AULA_MAX_FALLOS_IP:-30}
      AULA_MAX_REGISTROS_IP: ${AULA_MAX_REGISTROS_IP:-10}
      AULA_VENTANA_INTENTOS_MIN: ${AULA_VENTANA_INTENTOS_MIN:-15}
      AULA_REGISTRO_ABIERTO: ${AULA_REGISTRO_ABIERTO:-false}
      # Correo SOLO al buzón de pruebas local (guarda .eml en ./dev/buzon; nunca reenvía) y textos de PRUEBA.
      AULA_URL_PUBLICA: ${AULA_URL_PUBLICA:-http://127.0.0.1:8180}
      AULA_CORREO_MODO: smtp
      AULA_SMTP_HOST: buzon
      AULA_SMTP_PUERTO: "1025"
      AULA_SMTP_TLS: ninguno
      AULA_CORREO_REMITENTE: aula-pruebas@example.com
      AULA_PERMITIR_TEXTOS_PRUEBA: "true"
      AULA_ENLACE_VERIFICACION_MIN: ${AULA_ENLACE_VERIFICACION_MIN:-1440}
      AULA_ENLACE_RECUPERACION_MIN: ${AULA_ENLACE_RECUPERACION_MIN:-60}
      AULA_CORREOS_POR_HORA: ${AULA_CORREOS_POR_HORA:-3}
      AULA_MAX_CORREOS_IP: ${AULA_MAX_CORREOS_IP:-10}
      FORWARDED_ALLOW_IPS: "*"   # la API solo es accesible por la red interna, a través de nginx
    # Desarrollo: carga los textos de PRUEBA (marcados como tales) antes de arrancar.
    command: ["sh", "-c", "python -m app.migraciones && python -m app.documentos cargar-prueba && exec uvicorn app.main:crear_app --factory --host 0.0.0.0 --port 8000 --proxy-headers"]
    volumes: ["./documentos:/opt/aula/documentos:ro"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]
  buzon:
    # Buzón SMTP de pruebas: sin TLS ni salida a Internet; los mensajes quedan en ./dev/buzon (.eml).
    image: globalt-aula-api:dev
    command: ["python", "/opt/buzon/buzon_pruebas.py", "/buzon", "0.0.0.0", "1025"]
    volumes: ["./dev/buzon_pruebas.py:/opt/buzon/buzon_pruebas.py:ro", "./dev/buzon:/buzon"]
    user: "0:0"
    networks: [interna]
  web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on: [api]
    ports: ["127.0.0.1:${AULA_PUERTO_LOCAL:-8180}:80"]
    volumes:
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../..:/srv/sitio:ro
    networks: [interna]
networks:
  interna: {}
volumes:
  aula-datos: {}
