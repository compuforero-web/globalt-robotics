# nginx de la RÉPLICA DE ENSAYO de octavo: igual que services/aula-api/dev/nginx.conf más el lector del buzón ficticio.
server {
    listen 80;
    root /srv/sitio;
    index index.html;
    server_tokens off;
    location ~ /\. { deny all; }
    location ^~ /services/ { deny all; }
    location /api/aula/ {
        client_max_body_size 16k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Solo en el ensayo: abrir el enlace de verificación desde el celular sin usar la terminal.
    location = /buzon-ensayo/ {
        proxy_pass http://buzon-web:8025;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ =404; }
}
