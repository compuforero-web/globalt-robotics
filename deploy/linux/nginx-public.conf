# Entrada pública; administración y API continúan en la entrada privada 8094.
server {
    listen 80 default_server;
    server_name globalt-robotics.com www.globalt-robotics.com;
    root /srv/globalt-robotics/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    location ~ /\. { deny all; }
    location ~* ^/(admin(?:/|\.html|$)|src/admin(?:/|$)|api(?:/|$)) { return 403; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
