# Entrada pública (detrás de Cloudflare Tunnel) CON aula. La instala deploy/linux/aula-produccion.sh activar.
# Archivos estáticos como antes y proxy SOLO a las rutas necesarias de /api/aula/. Administración y
# acceso directo al compilador (/api/arduino) siguen bloqueados.
# __PUERTA_TUNEL__ se sustituye al activar por la puerta de enlace de la red Docker por la que llegan las
# conexiones a 127.0.0.1:8096 (las del conector del túnel, que usa la red del host).

limit_req_zone $binary_remote_addr zone=aula_api:4m rate=300r/m;

server {
    listen 80 default_server;
    server_name globalt-robotics.com www.globalt-robotics.com;
    root /srv/globalt-robotics/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    # IP del visitante: CF-Connecting-IP SOLO se acepta en conexiones que llegan por el puerto local del túnel.
    # Peticiones de otros contenedores conservan su propia IP; nginx sustituye X-Forwarded-For al reenviar.
    set_real_ip_from __PUERTA_TUNEL__;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ /\. { deny all; }
    location ~* ^/(admin(?:/|\.html|$)|src/admin(?:/|$)) { return 403; }

    # API del aula: lista cerrada de rutas. Los enlaces de los correos llevan el token en el fragmento (#),
    # que el navegador no envía: no aparece en este registro de accesos.
    location ~ "^/api/aula/(salud|config|cursos|mis-cursos|sesion|registro|inscripciones|familias(|/vincular|/alumnos|/alumnos/[1-9][0-9]*/(invitacion|actividad))|borradores/[a-z0-9-]{3,60}|compilador/salud|compilar|cuenta/(verificar|reenviar|recuperar|restablecer|autorizar)|documentos/(terminos|datos|politica)/[A-Za-z0-9][A-Za-z0-9.-]{0,39})$" {
        if ($http_x_forwarded_proto = "http") { return 403; }   # las cookies Secure exigen HTTPS
        limit_req zone=aula_api burst=150 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        client_body_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 75s;
        set $aula_api http://globalt-aula-api:8000;   # variable: nginx arranca aunque la API no esté
        proxy_pass $aula_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # sustituye, no añade
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
    }
    # Resto de la API (incluido /api/arduino, el compilador directo): bloqueado.
    location ~* ^/api(?:/|$) { return 403; }

    location /aula/ {
        if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
