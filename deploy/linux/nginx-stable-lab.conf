# Entrada privada por NetBird; la entrada pública conserva su propia configuración.
limit_req_zone $binary_remote_addr zone=arduino_stable:1m rate=20r/m;
upstream arduino_stable_backend {
    server unix:/compiler-socket/compilador.sock;
}
server {
    listen 80 default_server;
    server_name _;
    root /srv/globalt-robotics/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    location = /admin { try_files /admin.html =404; }
    location = /admin/ { try_files /admin.html =404; }
    location ~ /\. { deny all; }
    location = /api/arduino/salud {
        limit_except GET { deny all; }
        proxy_read_timeout 10s;
        proxy_pass http://arduino_stable_backend;
    }
    location = /api/arduino/compilar {
        limit_except POST { deny all; }
        limit_req zone=arduino_stable burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        client_body_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 40s;
        proxy_pass http://arduino_stable_backend;
    }
    location /api/ { return 403; }
    location / { try_files $uri $uri/ =404; }
}
