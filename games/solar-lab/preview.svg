<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="SolarLab: panel fotovoltaico con rayos solares y medidor MPPT 480W">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde047"/><stop offset="0.35" stop-color="#f59e0b" stop-opacity=".8"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047" stop-opacity=".95"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0f2a4f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <!-- Sol -->
  <circle cx="110" cy="90" r="90" fill="url(#glow)"/>
  <circle cx="110" cy="90" r="30" fill="#fde047"/>
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
    <path d="M110 40v-14M110 154v-14M60 90h-14M174 90h-14M75 55l-10-10M155 135l-10-10M75 125l-10 10M155 45l-10 10"/>
  </g>
  <!-- Rayos dorados -->
  <g fill="url(#ray)">
    <polygon points="132,108 300,190 292,204"/>
    <polygon points="140,96 372,166 366,182"/>
    <polygon points="128,120 248,238 238,248"/>
    <polygon points="138,112 432,214 424,230"/>
  </g>
  <!-- Panel fotovoltaico -->
  <g transform="translate(330 225) skewX(-18)">
    <rect x="-150" y="-60" width="300" height="120" rx="6" fill="url(#cell)" stroke="#cbd5e1" stroke-width="5"/>
    <g stroke="#38bdf8" stroke-opacity=".55" stroke-width="2">
      <path d="M-100-60v120M-50-60v120M0-60v120M50-60v120M100-60v120M-150-20h300M-150 20h300"/>
    </g>
    <path d="M-140-52l70 0-40 30z" fill="#ffffff" fill-opacity=".12"/>
  </g>
  <path d="M310 285v60M360 285v60" stroke="#64748b" stroke-width="8"/>
  <rect x="0" y="340" width="640" height="60" fill="#0f2a1c"/>
  <!-- Cable de energía -->
  <path d="M440 260 C 480 300, 470 330, 500 330" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="8 8"/>
  <!-- Medidor MPPT -->
  <g transform="translate(470 250)">
    <rect width="150" height="110" rx="14" fill="#0f182b" stroke="#38bdf8" stroke-width="3"/>
    <text x="75" y="26" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">MPPT</text>
    <rect x="14" y="36" width="122" height="44" rx="6" fill="#050a16" stroke="#1e2a44"/>
    <text x="75" y="68" fill="#22c55e" font-family="ui-monospace,monospace" font-size="26" font-weight="700" text-anchor="middle">480W</text>
    <circle cx="30" cy="94" r="5" fill="#22c55e"/><circle cx="48" cy="94" r="5" fill="#f59e0b"/>
    <rect x="66" y="90" width="68" height="8" rx="4" fill="#1e2a44"/><rect x="66" y="90" width="52" height="8" rx="4" fill="#f97316"/>
  </g>
  <!-- Título -->
  <text x="24" y="380" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="30" font-weight="800">Solar<tspan fill="#f59e0b">Lab</tspan></text>
  <text x="168" y="380" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="16" font-weight="600">Ingeniería Fotovoltaica</text>
</svg>
